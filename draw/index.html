<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Air Draw</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(18, 21, 30, .78); --ink: #f2f4f8; --muted: #9aa3b5; --accent: #ffd34d;
    --edge: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 500 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; transform: scaleX(-1); transition: opacity .3s; }
  body.no-video video { opacity: 0; }
  body.dim video { opacity: .45; }

  #toolbar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 18px; background: var(--panel);
    border: 1px solid var(--edge); backdrop-filter: blur(8px); z-index: 5; max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; }
  .tool { position: relative; width: 52px; height: 52px; border-radius: 14px; border: 2px solid transparent; cursor: pointer;
    display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--ink); font: 700 12px/1 system-ui; padding: 0; }
  .tool svg { width: 24px; height: 24px; }
  .tool.swatch::after { content: ""; width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .tool.swatch.rainbow::after { background: conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red); }
  .tool.active { border-color: var(--accent); background: rgba(255,211,77,.16); }
  .tool.hot { border-color: #fff; }
  .tool .ring { position: absolute; inset: -4px; border-radius: 16px; pointer-events: none;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 3px; }
  .sep { width: 1px; height: 36px; background: var(--edge); margin: 0 2px; }

  #status { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 7px 16px; font-size: 14px; color: var(--muted);
    z-index: 5; white-space: nowrap; }
  #status b { color: var(--ink); }

  #help { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; background: rgba(5,7,11,.82); padding: 16px; }
  #help .card { max-width: 440px; width: 100%; background: #151924; border: 1px solid var(--edge); border-radius: 20px; padding: 22px 22px 18px; }
  #help h1 { margin: 0 0 4px; font-size: 26px; }
  #help p { margin: 0 0 14px; color: var(--muted); }
  #help ul { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px; }
  #help li { display: flex; gap: 12px; align-items: center; }
  #help li span:first-child { font-size: 26px; width: 36px; text-align: center; }
  #help button.go { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #1a1a1a; font: 700 17px system-ui; cursor: pointer; }
  #help button.go:disabled { opacity: .6; cursor: wait; }
  #err { color: #ff9b9b; margin-top: 10px; font-size: 14px; min-height: 1em; }
  @media (max-width: 560px) { .tool { width: 42px; height: 42px; border-radius: 12px; } .tool.swatch::after { width: 24px; height: 24px; } .sep { display: none; } }
</style>
</head>
<body class="dim">
<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="paint"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="toolbar"></div>
<div id="status">Starting…</div>

<div id="help">
  <div class="card">
    <h1>✍️ Air Draw</h1>
    <p>Draw in the air with your finger. The camera follows your hand.</p>
    <ul>
      <li><span>☝️</span><span><b>One finger up</b> — draw</span></li>
      <li><span>✌️</span><span><b>Two fingers up</b> — move without drawing. Hover the buttons at the top to pick a colour.</span></li>
      <li><span>✋</span><span><b>Open hand</b> — eraser</span></li>
      <li><span>✊</span><span><b>Fist</b> — rest</span></li>
    </ul>
    <button class="go" id="go">Turn on camera</button>
    <div id="err"></div>
  </div>
</div>

<script type="module">
const MP_VER = '0.10.14';
const MP_BASE = window.MP_BASE || `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_URL = window.MODEL_URL || 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = (id) => document.getElementById(id);
const video = $('video'), paint = $('paint'), overlay = $('overlay');
const pctx = paint.getContext('2d', { willReadFrequently: true }), octx = overlay.getContext('2d');
const statusEl = $('status');

// ---------- state ----------
const COLORS = ['#ffffff', '#ff4d4d', '#ffa53d', '#ffe14d', '#4dff88', '#3dc8ff', '#7a6bff', '#ff5ce1'];
const state = { color: COLORS[5], rainbow: false, size: 10, hue: 0, bg: 'dim' };
let W = 0, H = 0, DPR = 1;

// ---------- toolbar ----------
const ICONS = {
  size: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="R" fill="currentColor"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  clear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/></svg>',
};
const toolbar = $('toolbar');
const tools = [];
function addTool({ cls = '', html = '', title, onPick, dwell = 0, style = '' }) {
  const b = document.createElement('button');
  b.className = 'tool ' + cls; b.title = title; b.innerHTML = html + '<i class="ring"></i>';
  if (style) b.style.cssText = style;
  b.addEventListener('click', () => onPick(b));
  b._pick = onPick; b._dwell = dwell;
  toolbar.appendChild(b); tools.push(b);
  return b;
}
function sep() { const s = document.createElement('div'); s.className = 'sep'; toolbar.appendChild(s); }

const swatches = COLORS.map((c) => addTool({ cls: 'swatch', title: c, style: `--c:${c}`, dwell: 0,
  onPick: (b) => { state.color = c; state.rainbow = false; markActive(b); } }));
const rainbowBtn = addTool({ cls: 'swatch rainbow', title: 'Rainbow', dwell: 0,
  onPick: (b) => { state.rainbow = true; markActive(b); } });
sep();
const SIZES = [5, 10, 20];
const sizeBtn = addTool({ title: 'Brush size', dwell: 700, onPick: () => {
  state.size = SIZES[(SIZES.indexOf(state.size) + 1) % SIZES.length]; renderSize(); } });
function renderSize() { sizeBtn.innerHTML = ICONS.size.replace('R', { 5: 3, 10: 5.5, 20: 9 }[state.size]) + '<i class="ring"></i>'; }
renderSize();
addTool({ html: ICONS.undo, title: 'Undo', dwell: 700, onPick: undo });
addTool({ html: ICONS.clear, title: 'Clear', dwell: 1000, onPick: clearAll });
addTool({ html: ICONS.cam, title: 'Camera: dim / on / off', dwell: 700, onPick: () => {
  state.bg = { dim: 'on', on: 'off', off: 'dim' }[state.bg];
  document.body.classList.toggle('dim', state.bg === 'dim');
  document.body.classList.toggle('no-video', state.bg === 'off');
} });
addTool({ html: ICONS.save, title: 'Save picture', dwell: 1000, onPick: save });

function markActive(btn) { for (const s of [...swatches, rainbowBtn]) s.classList.toggle('active', s === btn); }
markActive(swatches[5]);

// ---------- canvas sizing ----------
function resize() {
  const keep = document.createElement('canvas');
  keep.width = paint.width; keep.height = paint.height;
  if (paint.width) keep.getContext('2d').drawImage(paint, 0, 0);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [paint, overlay]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  if (keep.width) pctx.drawImage(keep, 0, 0, keep.width, keep.height, 0, 0, paint.width, paint.height);
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- undo / clear / save ----------
const history = [];
function snapshot() {
  history.push(pctx.getImageData(0, 0, paint.width, paint.height));
  if (history.length > 25) history.shift();
}
function undo() { const img = history.pop(); if (img) pctx.putImageData(img, 0, 0); }
function clearAll() { snapshot(); pctx.clearRect(0, 0, W, H); }
function save() {
  const out = document.createElement('canvas'); out.width = paint.width; out.height = paint.height;
  const o = out.getContext('2d');
  o.fillStyle = '#0b0d12'; o.fillRect(0, 0, out.width, out.height);
  if (state.bg !== 'off' && video.videoWidth) {
    const { s, ox, oy } = cover();
    o.save(); o.globalAlpha = state.bg === 'dim' ? .45 : 1;
    o.translate(out.width, 0); o.scale(-1, 1);
    o.drawImage(video, ox * DPR, oy * DPR, video.videoWidth * s * DPR, video.videoHeight * s * DPR);
    o.restore();
  }
  o.drawImage(paint, 0, 0);
  const a = document.createElement('a');
  a.download = `air-draw-${Date.now()}.png`; a.href = out.toDataURL('image/png'); a.click();
}

// ---------- coordinate mapping (video is object-fit: cover + mirrored) ----------
function cover() {
  const vw = video.videoWidth || 1, vh = video.videoHeight || 1;
  const s = Math.max(W / vw, H / vh);
  return { s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2, vw, vh };
}
function toScreen(lm) {
  const { s, ox, oy, vw, vh } = cover();
  return { x: ox + (1 - lm.x) * vw * s, y: oy + lm.y * vh * s };
}

// ---------- gesture reading ----------
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function fingersUp(lm) {
  // a finger is "up" when its tip is clearly farther from the wrist than its middle joint
  const w = lm[0];
  const up = (tip, pip) => d2(lm[tip], w) > d2(lm[pip], w) * 1.12;
  const thumb = d2(lm[4], lm[17]) > d2(lm[3], lm[17]) * 1.05 && d2(lm[4], lm[5]) > d2(lm[0], lm[5]) * 0.45;
  return { thumb, index: up(8, 6), middle: up(12, 10), ring: up(16, 14), pinky: up(20, 18) };
}
function classify(f) {
  const n = f.index + f.middle + f.ring + f.pinky;
  if (n >= 4) return 'erase';
  if (f.index && !f.middle && !f.ring && !f.pinky) return 'draw';
  if (f.index && f.middle && !f.ring && !f.pinky) return 'hover';
  if (n === 0) return 'rest';
  return 'hover';
}

// per-hand trackers (keyed by handedness so two hands can draw at once)
const hands = new Map();
function tracker(key) {
  if (!hands.has(key)) hands.set(key, { p: null, last: null, mode: 'rest', cand: 'rest', candN: 0, seen: 0, hot: null, hotT: 0, fired: false });
  return hands.get(key);
}

function strokeColor() {
  if (!state.rainbow) return state.color;
  state.hue = (state.hue + 2.5) % 360;
  return `hsl(${state.hue} 95% 60%)`;
}

let strokeStarted = false;
function handleHand(lm, key, now) {
  const t = tracker(key);
  t.seen = now;
  const raw = classify(fingersUp(lm));
  // debounce: need the same gesture for a few frames before switching (stops stray lines)
  if (raw === t.cand) t.candN++; else { t.cand = raw; t.candN = 1; }
  const need = raw === 'draw' ? 2 : 3;
  if (t.candN >= need && t.mode !== raw) { t.mode = raw; t.last = null; }

  // pointer position: fingertip for draw/hover, palm centre for eraser
  const target = t.mode === 'erase'
    ? toScreen({ x: (lm[0].x + lm[5].x + lm[17].x + lm[9].x) / 4, y: (lm[0].y + lm[5].y + lm[17].y + lm[9].y) / 4 })
    : t.mode === 'hover'
      ? toScreen({ x: (lm[8].x + lm[12].x) / 2, y: (lm[8].y + lm[12].y) / 2 })
      : toScreen(lm[8]);

  // smoothing: follow fast motion quickly, damp jitter when still
  if (!t.p) t.p = { ...target };
  const dist = Math.hypot(target.x - t.p.x, target.y - t.p.y);
  const k = Math.min(1, 0.25 + dist / 60);
  t.p.x += (target.x - t.p.x) * k; t.p.y += (target.y - t.p.y) * k;
  const p = t.p;

  if (t.mode === 'draw') {
    if (!strokeStarted) { snapshot(); strokeStarted = true; }
    pctx.globalCompositeOperation = 'source-over';
    pctx.strokeStyle = strokeColor(); pctx.lineWidth = state.size;
    pctx.lineCap = 'round'; pctx.lineJoin = 'round';
    pctx.beginPath();
    const from = t.last || p;
    pctx.moveTo(from.x, from.y); pctx.lineTo(p.x + 0.01, p.y);
    pctx.stroke();
    t.last = { x: p.x, y: p.y };
  } else if (t.mode === 'erase') {
    if (!strokeStarted) { snapshot(); strokeStarted = true; }
    const r = Math.max(30, d2(toScreen(lm[0]), toScreen(lm[9])) * 0.7);
    pctx.globalCompositeOperation = 'destination-out';
    pctx.lineWidth = r * 2; pctx.lineCap = 'round';
    pctx.beginPath();
    const from = t.last || p;
    pctx.moveTo(from.x, from.y); pctx.lineTo(p.x + 0.01, p.y); pctx.stroke();
    pctx.globalCompositeOperation = 'source-over';
    t.last = { x: p.x, y: p.y };
    t.eraseR = r;
  } else {
    t.last = null;
  }

  // toolbar hover-select (only while hovering with two fingers)
  let hot = null;
  if (t.mode === 'hover') {
    const el = document.elementFromPoint(p.x, p.y);
    hot = el && el.closest && el.closest('.tool');
  }
  if (hot !== t.hot) { t.hot = hot; t.hotT = now; t.fired = false; }
  if (hot && !t.fired && now - t.hotT >= hot._dwell) { t.fired = true; hot._pick(hot); }

  return { t, p, lm };
}

// ---------- overlay ----------
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawOverlay(items, now) {
  octx.clearRect(0, 0, W, H);
  for (const b of tools) { b.classList.remove('hot'); b.querySelector('.ring').style.setProperty('--p', 0); }
  for (const { t, p, lm } of items) {
    const pts = lm.map(toScreen);
    octx.strokeStyle = 'rgba(255,255,255,.35)'; octx.lineWidth = 2;
    octx.beginPath();
    for (const [a, b] of BONES) { octx.moveTo(pts[a].x, pts[a].y); octx.lineTo(pts[b].x, pts[b].y); }
    octx.stroke();
    octx.fillStyle = 'rgba(255,255,255,.6)';
    for (const q of pts) { octx.beginPath(); octx.arc(q.x, q.y, 2.5, 0, 7); octx.fill(); }

    octx.lineWidth = 3;
    if (t.mode === 'draw') {
      octx.fillStyle = state.rainbow ? `hsl(${state.hue} 95% 60%)` : state.color;
      octx.beginPath(); octx.arc(p.x, p.y, Math.max(6, state.size / 2 + 2), 0, 7); octx.fill();
      octx.strokeStyle = '#000a'; octx.stroke();
    } else if (t.mode === 'erase') {
      octx.strokeStyle = '#fff'; octx.setLineDash([8, 6]);
      octx.beginPath(); octx.arc(p.x, p.y, t.eraseR || 40, 0, 7); octx.stroke(); octx.setLineDash([]);
    } else if (t.mode === 'hover') {
      octx.strokeStyle = state.rainbow ? '#fff' : state.color;
      octx.beginPath(); octx.arc(p.x, p.y, 14, 0, 7); octx.stroke();
      octx.beginPath(); octx.moveTo(p.x - 20, p.y); octx.lineTo(p.x - 8, p.y); octx.moveTo(p.x + 8, p.y); octx.lineTo(p.x + 20, p.y);
      octx.moveTo(p.x, p.y - 20); octx.lineTo(p.x, p.y - 8); octx.moveTo(p.x, p.y + 8); octx.lineTo(p.x, p.y + 20); octx.stroke();
    }
    if (t.hot) {
      t.hot.classList.add('hot');
      if (t.hot._dwell && !t.fired) t.hot.querySelector('.ring').style.setProperty('--p', Math.min(1, (now - t.hotT) / t.hot._dwell));
    }
  }
}

const LABEL = { draw: '☝️ <b>Drawing</b>', hover: '✌️ <b>Moving</b> — hover a button to pick it', erase: '✋ <b>Erasing</b>', rest: '✊ <b>Resting</b>' };
function setStatus(items) {
  const html = items.length ? LABEL[items[0].t.mode] : 'Show your hand to the camera 👋';
  if (statusEl.innerHTML !== html) statusEl.innerHTML = html;
}

// ---------- mouse / touch fallback (draw with a finger on the screen too) ----------
let mouseLast = null;
overlay.addEventListener('pointerdown', (e) => { snapshot(); mouseLast = { x: e.clientX, y: e.clientY }; overlay.setPointerCapture(e.pointerId); });
overlay.addEventListener('pointermove', (e) => {
  if (!mouseLast) return;
  pctx.strokeStyle = strokeColor(); pctx.lineWidth = state.size; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(mouseLast.x, mouseLast.y); pctx.lineTo(e.clientX, e.clientY); pctx.stroke();
  mouseLast = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { mouseLast = null; });

// keyboard shortcuts
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'c') clearAll();
  else if (e.key === 's') save();
});

// ---------- start ----------
let landmarker = null;
async function loadModel() {
  const { FilesetResolver, HandLandmarker } = await import(`${MP_BASE}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
  const opts = (delegate) => ({ baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numHands: 2,
    minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.5 });
  try { return await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch (e) { console.warn('GPU failed, using CPU', e); return await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
}

async function start() {
  const go = $('go'), err = $('err');
  go.disabled = true; go.textContent = 'Starting camera…'; err.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream; await video.play();
    go.textContent = 'Loading hand tracking…';
    landmarker = await loadModel();
    $('help').hidden = true;
    loop();
  } catch (e) {
    console.error(e);
    go.disabled = false; go.textContent = 'Try again';
    err.textContent = e && e.name === 'NotAllowedError'
      ? 'Camera permission was blocked. Allow the camera in your browser settings and try again.'
      : 'Could not start: ' + (e && e.message || e);
  }
}
$('go').addEventListener('click', start);

let lastVideoTime = -1;
function loop() {
  const now = performance.now();
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    const items = [];
    (res.landmarks || []).forEach((lm, i) => {
      const key = res.handednesses?.[i]?.[0]?.categoryName || String(i);
      items.push(handleHand(lm, key, now));
    });
    // forget hands that disappeared so their next stroke starts fresh
    for (const [k, t] of hands) if (now - t.seen > 200) hands.delete(k);
    if (!items.some(({ t }) => t.mode === 'draw' || t.mode === 'erase')) strokeStarted = false;
    drawOverlay(items, now);
    setStatus(items);
  }
  requestAnimationFrame(loop);
}
statusEl.textContent = 'Tap “Turn on camera” to start';
</script>
</body>
</html>
